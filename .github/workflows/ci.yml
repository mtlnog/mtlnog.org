name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck:worker
      - name: Build (dummy public env values — real ones live in the Cloudflare Workers project)
        run: npm run build
        env:
          PUBLIC_TURNSTILE_SITEKEY: 1x00000000000000000000AA
