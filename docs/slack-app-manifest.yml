# Slack app for the mtlnog.org contact form.
# Create it at https://api.slack.com/apps → Create New App → From an app manifest,
# pick the MTLNOG workspace, paste this file, then Install to Workspace and choose the
# private channel. Copy the webhook URL into the SLACK_WEBHOOK_URL Worker secret.
display_information:
  name: MTLNOG Contact Form
  description: Posts messages sent through the contact form on mtlnog.org.
  background_color: "#08090d"
features:
  bot_user:
    display_name: MTLNOG site
    always_online: false
oauth_config:
  scopes:
    bot:
      - incoming-webhook
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
